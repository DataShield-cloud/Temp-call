<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Owner</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<script>
// YEH CODE TUMHARI REPO ME DAALO - Fixed version
const LIVE_BASE="https://datashield-cloud.github.io/Temp-call/";
let carId=new URLSearchParams(location.search).get('car_id')?.toUpperCase()||'';
let peer, localStream, currentCall;

async function startCall(){
  if(!carId){ alert('car_id missing'); return; }
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    peer=new Peer(); // random ID for caller
    peer.on('open',()=>{
      document.getElementById('status').innerText='Ringing owner of '+carId+'...';
      currentCall=peer.call(carId, localStream); // CALL OWNER ID
      if(!currentCall){ document.getElementById('status').innerText='Owner offline'; return; }
      
      // FIX: Connected tabhi jab stream aaye
      currentCall.on('stream', (remoteStream)=>{
        document.getElementById('remoteAudio').srcObject=remoteStream;
        document.getElementById('remoteAudio').play().then(()=>{
          document.getElementById('status').innerText='✅ Connected - Baat karo';
        }).catch(()=>{
          document.getElementById('status').innerHTML='✅ Connected - <button onclick="document.getElementById(\'remoteAudio\').play()">Tap for Audio</button>';
        });
      });
      currentCall.on('close',()=>{ document.getElementById('status').innerText='Call ended'; });
    });
    peer.on('error',e=>{ document.getElementById('status').innerText=e.type==='peer-unavailable'?'Owner offline hai':e.message; });
  }catch(e){ alert('Mic allow karo: '+e.message); }
}
</script>
<div style="text-align:center;font-family:sans-serif;padding:20px">
<h3 id="plate"></h3>
<p id="status">Ready</p>
<button onclick="startCall()">📞 Call Owner</button>
<audio id="remoteAudio" autoplay playsinline></audio>
</div>
<script>document.getElementById('plate').innerText=carId||'NO ID';</script>
</body>
</html>
